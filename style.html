<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #1f2937;
    --subtle: #6b7280;
    --primary: #1d4ed8;
    --good: #15803d;
    --bad: #b91c1c;
    --line: #dbe4f0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  .topbar {
    background: #0f172a;
    color: #fff;
    padding: 1rem;
    text-align: center;
  }

  .topbar h1 {
    margin: 0;
    font-size: 1.4rem;
  }

  .topbar p {
    margin: 0.4rem 0 0;
    color: #cbd5e1;
    font-size: 0.9rem;
  }

  .container {
    max-width: 1100px;
    margin: 1rem auto;
    padding: 0 0.8rem 1.2rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .flow-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.8rem;
  }

  label {
    display: block;
    margin-bottom: 0.3rem;
    font-size: 0.9rem;
    color: var(--subtle);
  }

  select {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  .chapter-header h2 { margin: 0; }
  .chapter-header p { color: var(--subtle); margin: 0.2rem 0 0.8rem; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .tab-btn {
    border: 1px solid var(--line);
    background: #eef2ff;
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
    cursor: pointer;
  }

  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .block {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.8rem;
    margin-bottom: 0.8rem;
    background: #fff;
  }

  .iframe-wrap iframe {
    width: 100%;
    min-height: 420px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .question-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.8rem;
    margin-bottom: 0.8rem;
  }

  .options label {
    display: block;
    margin-bottom: 0.4rem;
    color: var(--ink);
  }

  .check-btn {
    border: none;
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
    cursor: pointer;
  }

  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .score-box {
    font-weight: bold;
    margin: 0.8rem 0;
  }

  .hidden { display: none; }

  @media (max-width: 800px) {
    .flow-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
